<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Same official Disclarion brand mark as disclarion.svg. No dark-mode-
       specific styling needed: it's an open ring + dot on a transparent
       background (no solid fill), and this exact mark already renders on
       disclarion.com's own dark surface (the site footer) without
       adjustment. -->
  <circle
    cx="32" cy="32" r="22"
    stroke="#4F46E5"
    stroke-width="11"
    stroke-dasharray="130 8.3"
    transform="rotate(-94 32 32)"
  />
  <circle cx="32" cy="10" r="3.6" fill="#06B6D4"/>
</svg>
