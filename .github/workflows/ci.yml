name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-$
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Duplicate-style names ("page 2.tsx", "components 2") are iCloud/Finder
      # conflict copies and must never be tracked; see CLAUDE.md. Tests run
      # first so a broken checker can't pass vacuously.
      - name: Duplicate-name guard (tests + check)
        run: |
          sh scripts/test-check-duplicate-names.sh
          sh .claude/hooks/test-block-duplicate-names.sh
          sh scripts/check-duplicate-names.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'
